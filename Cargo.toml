[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/ml-rust/hydr"
publish = false

[workspace.dependencies]
numr = { version = "0.15.2", default-features = false }
solvr = { version = "0.3.1", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
hydr-channel = { path = "crates/hydr-channel", version = "=0.1.0" }
hydr-core = { path = "crates/hydr-core", version = "=0.1.0" }
hydr-soil = { path = "crates/hydr-soil", version = "=0.1.0" }
hydr-storage = { path = "crates/hydr-storage", version = "=0.1.0" }
hydr-structures = { path = "crates/hydr-structures", version = "=0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[package]
name = "hydr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Hydrology and hydraulic simulation on numr runtimes"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["hydraulics", "shallow-water", "flood", "simulation"]
categories = ["science", "simulation"]
publish.workspace = true
exclude = [".agents/", "resource/", ".github/", "crates/"]

[features]
cuda = ["numr/cuda", "solvr/cuda", "hydr-channel/cuda", "hydr-core/cuda", "hydr-soil/cuda", "hydr-storage/cuda", "hydr-structures/cuda"]
wgpu = ["numr/wgpu", "solvr/wgpu", "hydr-channel/wgpu", "hydr-core/wgpu", "hydr-soil/wgpu", "hydr-storage/wgpu", "hydr-structures/wgpu"]

[dependencies]
hydr-channel = { workspace = true }
hydr-core = { workspace = true }
hydr-soil = { workspace = true }
hydr-storage = { workspace = true }
hydr-structures = { workspace = true }
numr = { workspace = true }
solvr = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
