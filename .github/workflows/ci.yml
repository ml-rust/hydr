name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.95.0", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ml-rust/numr
          path: .ci-dependencies/numr
      - uses: actions/checkout@v4
        with:
          repository: ml-rust/solvr
          path: .ci-dependencies/solvr
      - name: Configure checked numerical dependency
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          numr = { path = ".ci-dependencies/numr" }
          solvr = { path = ".ci-dependencies/solvr" }
          EOF
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: python3 -m unittest discover -s tools/reference -p test_swmm_runoff.py
      - run: python3 -m unittest discover -s tools/reference -p test_subcatchment_temporal.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - run: cargo test --doc --all-features
      - run: cargo run --example grid
      - run: cargo run --example rain_basin
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
